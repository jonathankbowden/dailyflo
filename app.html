<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitFlow - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-body">
    <header class="app-header">
        <nav class="nav">
            <div class="nav-brand">
                <a href="index.html">
                    <h1>HabitFlow</h1>
                </a>
            </div>
            <div class="nav-links">
                <span class="current-date" id="currentDate"></span>
            </div>
        </nav>
    </header>

    <main class="dashboard">
        <div class="container">
            <!-- Stats Overview -->
            <section class="stats-overview">
                <div class="stat-card">
                    <h3 id="totalHabits">0</h3>
                    <p>Total Habits</p>
                </div>
                <div class="stat-card">
                    <h3 id="completedToday">0</h3>
                    <p>Completed Today</p>
                </div>
                <div class="stat-card">
                    <h3 id="longestStreak">0</h3>
                    <p>Longest Streak</p>
                </div>
                <div class="stat-card">
                    <h3 id="completionRate">0%</h3>
                    <p>This Week</p>
                </div>
            </section>

            <!-- Add Habit Form -->
            <section class="add-habit-section">
                <button class="btn btn-primary" id="addHabitBtn">+ Add New Habit</button>

                <div class="add-habit-form" id="addHabitForm" style="display: none;">
                    <div class="form-group">
                        <label for="habitName">Habit Name</label>
                        <input type="text" id="habitName" placeholder="e.g., Drink 8 glasses of water">
                    </div>
                    <div class="form-group">
                        <label for="habitCategory">Category</label>
                        <select id="habitCategory">
                            <option value="health">Health</option>
                            <option value="fitness">Fitness</option>
                            <option value="productivity">Productivity</option>
                            <option value="mindfulness">Mindfulness</option>
                            <option value="learning">Learning</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
                        <button class="btn btn-primary" id="saveHabitBtn">Save Habit</button>
                    </div>
                </div>
            </section>

            <!-- Habits Grid -->
            <section class="habits-section">
                <h2>Today's Habits</h2>
                <div class="habits-grid" id="habitsGrid">
                    <!-- Habit cards will be dynamically inserted here -->
                </div>

                <!-- Empty State -->
                <div class="empty-state" id="emptyState">
                    <img src="images/mockups/empty-state.svg" alt="No habits yet" />
                    <h3>No habits yet</h3>
                    <p>Start building better habits by adding your first one!</p>
                    <button class="btn btn-primary" onclick="document.getElementById('addHabitBtn').click()">Add Your First Habit</button>
                </div>
            </section>

            <!-- Progress Chart -->
            <section class="progress-section">
                <h2>Weekly Progress</h2>
                <div class="progress-chart">
                    <canvas id="progressChart" width="400" height="200"></canvas>
                </div>
            </section>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>

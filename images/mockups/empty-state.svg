<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emptyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#emptyBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Calendar/checklist illustration -->
  <rect x="35" y="30" width="50" height="60" fill="white" rx="6" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Calendar header -->
  <rect x="35" y="30" width="50" height="15" fill="#64748b" rx="6"/>
  <rect x="35" y="37" width="50" height="8" fill="#64748b"/>

  <!-- Calendar rings -->
  <rect x="45" y="25" width="3" height="10" fill="#94a3b8" rx="1.5"/>
  <rect x="72" y="25" width="3" height="10" fill="#94a3b8" rx="1.5"/>

  <!-- Empty checkboxes -->
  <rect x="42" y="52" width="8" height="8" fill="white" stroke="#cbd5e1" stroke-width="1" rx="2"/>
  <rect x="42" y="65" width="8" height="8" fill="white" stroke="#cbd5e1" stroke-width="1" rx="2"/>
  <rect x="42" y="78" width="8" height="8" fill="white" stroke="#cbd5e1" stroke-width="1" rx="2"/>

  <!-- Placeholder lines -->
  <rect x="55" y="54" width="20" height="2" fill="#e2e8f0" rx="1"/>
  <rect x="55" y="58" width="15" height="2" fill="#e2e8f0" rx="1"/>

  <rect x="55" y="67" width="18" height="2" fill="#e2e8f0" rx="1"/>
  <rect x="55" y="71" width="12" height="2" fill="#e2e8f0" rx="1"/>

  <rect x="55" y="80" width="22" height="2" fill="#e2e8f0" rx="1"/>
  <rect x="55" y="84" width="16" height="2" fill="#e2e8f0" rx="1"/>

  <!-- Floating plus sign -->
  <circle cx="85" cy="45" r="8" fill="#3b82f6" opacity="0.2"/>
  <path d="M81 45H89M85 41V49" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
</svg>